# =============================================================================
# HAProxy SNI (Server Name Indication) configuration
#
# Multiple domains on a single VIP — each with its own cert.
# HAProxy reads the SNI header (domain name) during TLS handshake,
# selects the matching certificate, and routes to the correct backend.
#
# Cert naming: /etc/haproxy/certs/<domain>.pem
# Each .pem = cert chain + key (HAProxy format)
# =============================================================================

global
    log stdout format raw local0
    log stdout format raw local1 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout http-request 10s
    timeout http-keep-alive 10s

# =============================================================================
# Stats page
# =============================================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /haproxy?stats
    stats refresh 10s
    stats admin if LOCALHOST

# =============================================================================
# HTTP → HTTPS redirect (any domain)
# =============================================================================
frontend http_in
    bind *:80
    http-request redirect scheme https code 301

# =============================================================================
# HTTPS — SNI routing
#
# "ssl crt /etc/haproxy/certs/" tells HAProxy to load all .pem files
# from that directory. For each incoming TLS connection, HAProxy:
#   1. Reads the SNI hostname from the client
#   2. Looks for certs/<sni>.pem
#   3. If found, uses that cert and routes per the ACLs below
#   4. If not found, uses the first .pem alphabetically (default backend)
# =============================================================================
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/

    # --- Match domain names from the TLS SNI header ---
    acl host_proxmox ssl_fc_sni -i proxmox.local
    acl host_gitlab    ssl_fc_sni -i gitlab.local
    acl host_jenkins   ssl_fc_sni -i jenkins.local

    # --- Route to the right backend pool ---
    use_backend proxmox_nodes if host_proxmox
    use_backend gitlab_nodes  if host_gitlab
    use_backend jenkins_nodes if host_jenkins

    # Fallback for unknown domains
    default_backend proxmox_nodes

# =============================================================================
# Backend: Proxmox cluster (port 8006)
# =============================================================================
backend proxmox_nodes
    balance roundrobin
    option httpchk GET /api2/json
    http-check expect status 200,401
    default-server ssl verify none
    inter 3000 rise 2 fall 3
    server proxmox1 10.168.5.97:8006 check
    server proxmox2 10.168.5.54:8006 check
    server proxmox3 10.168.5.42:8006 check

# =============================================================================
# Backend: GitLab (port 443)
# =============================================================================
backend gitlab_nodes
    balance roundrobin
    option httpchk GET /-/health
    http-check expect status 200
    default-server ssl verify none
    inter 3000 rise 2 fall 3
    # Replace these with your actual GitLab node IPs
    # server gitlab1 10.168.5.10:443 check
    # server gitlab2 10.168.5.11:443 check

# =============================================================================
# Backend: Jenkins (port 443)
# =============================================================================
backend jenkins_nodes
    balance roundrobin
    option httpchk GET /login
    http-check expect status 200
    default-server ssl verify none
    inter 3000 rise 2 fall 3
    # Replace these with your actual Jenkins node IPs
    # server jenkins1 10.168.5.20:443 check
    # server jenkins2 10.168.5.21:443 check
