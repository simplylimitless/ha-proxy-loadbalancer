# =============================================================================
# HAProxy SNI (Server Name Indication) configuration
#
# This configuration supports multiple domains/vhosts on a single IP/port,
# each with its own certificate. HAProxy uses the SNI extension in the TLS
# handshake to select the correct certificate and route traffic to the
# appropriate backend.
#
# Certificate naming convention:
#   /etc/haproxy/certs/<domain>.pem
#
# Each .pem file must contain the full certificate chain:
#   server cert + intermediate CA(s) + root CA (if applicable)
#   (key is embedded in the .pem file for HAProxy)
#
# Example certificates directory:
#   /etc/haproxy/certs/proxmox.example.com.pem   <- Proxmox cluster cert
#   /etc/haproxy/certs/git.example.com.pem       <- GitLab cert
#   /etc/haproxy/certs/jenkins.example.com.pem   <- Jenkins cert
#   /etc/haproxy/certs/default.pem               <- Fallback for unknown domains
# =============================================================================

global
    log stdout format raw local0
    log stdout format raw local1 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

    # SSL tuning — cache for performance
    ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close

    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout http-request 10s
    timeout http-keep-alive 10s

# =============================================================================
# Stats page (accessible on any port)
# =============================================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /haproxy?stats
    stats refresh 10s
    stats admin if LOCALHOST

# =============================================================================
# HTTP frontend — redirect all HTTP to HTTPS (any domain)
# =============================================================================
frontend http_in
    bind *:80
    http-request redirect scheme https code 301

# =============================================================================
# HTTPS frontend — SNI-based routing
#
# HAProxy automatically looks in /etc/haproxy/certs/ for .pem files.
# When a client connects, HAProxy reads the SNI header (domain name)
# and loads the matching certificate (certs/<sni>.pem).
#
# If no matching cert is found, HAProxy tries the first .pem alphabetically,
# or you can specify a default with: bind *:443 ssl crt /etc/haproxy/certs/
#
# See: https://cbonte.github.io/haproxy-dconv/2.8/configuration.html#5.1-ssl-crt-list
# =============================================================================
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/

    # --- ACLs: match SNI hostname ---
    acl host_proxmox ssl_fc_sni -i proxmox.example.com
    acl host_git     ssl_fc_sni -i git.example.com
    acl host_jenkins ssl_fc_sni -i jenkins.example.com

    # --- Route to backends based on SNI ---
    use_backend proxmox_nodes if host_proxmox
    use_backend git_nodes if host_git
    use_backend jenkins_nodes if host_jenkins

    # Default backend for unknown domains (serves first cert alphabetically)
    default_backend proxmox_nodes

# =============================================================================
# Backend: Proxmox cluster (port 8006)
# =============================================================================
backend proxmox_nodes
    balance roundrobin

    # Health check — Proxmox API returns 200 or 401 (both mean "alive")
    option httpchk GET /api2/json
    http-check expect status 200,401

    # Disable SSL verification for self-signed Proxmox certs
    default-server ssl verify none

    inter 3000 rise 2 fall 3

    # Replace with your actual Proxmox node IPs
    server proxmox1 10.168.5.97:8006 check
    server proxmox2 10.168.5.54:8006 check
    server proxmox3 10.168.5.42:8006 check

# =============================================================================
# Backend: GitLab (port 443)
# =============================================================================
backend git_nodes
    balance roundrobin

    # Health check — GitLab /-/health endpoint
    option httpchk GET /-/health
    http-check expect status 200

    # If GitLab uses its own cert: disable verification
    default-server ssl verify none

    inter 3000 rise 2 fall 3

    # Replace with your GitLab node IPs
    server git1 10.168.5.10:443 check
    server git2 10.168.5.11:443 check

# =============================================================================
# Backend: Jenkins (port 8080)
# =============================================================================
backend jenkins_nodes
    balance roundrobin

    # Health check — Jenkins /login page
    option httpchk GET /login
    http-check expect status 200

    inter 3000 rise 2 fall 3

    # Replace with your Jenkins node IPs
    server jenkins1 10.168.5.20:8080 check
    server jenkins2 10.168.5.21:8080 check
